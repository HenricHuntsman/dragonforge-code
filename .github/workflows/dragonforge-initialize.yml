name: One-time DragonForge source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'HenricHuntsman/dragonforge-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify empty destination and fetch complete original history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD)" = "1"
          test -f .github/workflows/dragonforge-initialize.yml
          git remote add historical-opencode https://github.com/HenricHuntsman/opencode.git
          git fetch historical-opencode main
          test "$(git rev-parse FETCH_HEAD)" = "9c101864c3d4b6eb5580c5b154948187a87f3b9c"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              merge --allow-unrelated-histories --no-ff FETCH_HEAD \
                -m 'Import full OpenCode Revival main history into standalone DragonForge'
          test -f LICENSE
          test -f go.mod

      - name: Apply independent module name and preserve attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old = "github.com/opencode-ai/opencode"
          new = "github.com/HenricHuntsman/dragonforge-code"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.name != "go.mod" and path.suffix != ".go":
                  continue
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
          assert Path("go.mod").read_text().startswith("module " + new + "\n")
          Path("docs").mkdir(exist_ok=True)
          Path("docs/OPENCODE-REVIVAL-README.md").write_text(
              Path("README.md").read_text(encoding="utf-8"), encoding="utf-8")
          Path("README.md").write_text("""# DragonForge Code

          Independent, local-first Go coding agent based on the MIT-licensed OpenCode Go project
          and the HenricHuntsman OpenCode Revival fork.

          - Original code, copyright and contribution terms: [LICENSE](LICENSE).
          - Prior README: [docs/OPENCODE-REVIVAL-README.md](docs/OPENCODE-REVIVAL-README.md).
          - This standalone repository preserves the full OpenCode Revival commit ancestry.

          ## Build

          ```bash
          go mod verify
          go vet ./...
          go test ./... -count=1
          go build -o dragonforge .
          ./dragonforge --version
          ```

          Development priorities: interactive Go agent, local Ollama/Qwen support,
          isolated Nintendo 64 and TraceForge reference workspaces, security review,
          and independently managed releases.

          **Migration status:** initial code import and Go module rename.
          UI/installer/release names may still say OpenCode until reviewed separately.
          """, encoding="utf-8")
          PY
          git rm .github/workflows/dragonforge-initialize.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Establish DragonForge Code module and independent documentation'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module and build all packages
        run: |
          go mod verify
          go vet ./...
          go test ./... -count=1
          go build ./...
          go build -o "$RUNNER_TEMP/dragonforge" .
          "$RUNNER_TEMP/dragonforge" --version

      - name: Publish verified independent repository
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test "$(sed -n '1p' go.mod)" = 'module github.com/HenricHuntsman/dragonforge-code'
          git push origin HEAD:main

      - name: Save compiled Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: dragonforge-linux-amd64-initial
          path: ${{ runner.temp }}/dragonforge
          if-no-files-found: error
