name: Preserve historical upstream releases

on:
  workflow_dispatch:
  push:
    branches: [main, archive/upstream-releases]
    paths:
      - .github/workflows/archive-upstream-releases.yml
      - scripts/mirror_upstream_releases.py

permissions:
  contents: write

concurrency:
  group: historical-opencode-release-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'HenricHuntsman/dragonforge-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test archive validation
        run: python3 tests/test_upstream_archive.py
      - name: Verify catalog
        run: python3 scripts/mirror_upstream_releases.py
      - name: Preserve all upstream branch and tag objects
        run: |
          git clone --mirror https://github.com/opencode-ai/opencode.git "$RUNNER_TEMP/upstream.git"
          git -C "$RUNNER_TEMP/upstream.git" bundle create "$RUNNER_TEMP/upstream-history.bundle" --all
          git -C "$RUNNER_TEMP/upstream.git" bundle verify "$RUNNER_TEMP/upstream-history.bundle"
      - name: Preserve historical releases and verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_BASE_SHA: 96cada506a8484deee9145209beb97877102ee08
        run: python3 scripts/mirror_upstream_releases.py --publish --history-bundle "$RUNNER_TEMP/upstream-history.bundle"
